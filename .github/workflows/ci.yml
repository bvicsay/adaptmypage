name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter adaptmypage typecheck
      - run: pnpm --filter adaptmypage test
      - run: pnpm --filter adaptmypage build
      - run: pnpm --filter web exec next typegen
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web build
        env:
          NEXT_PUBLIC_SITE_URL: https://adaptmypage.com
